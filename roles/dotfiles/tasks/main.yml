- name: Skip if dotfiles disabled
  ansible.builtin.meta: end_role
  when: not dotfiles_enabled

- name: Install shell toolchain
  ansible.builtin.apt:
    name: [git, curl, zsh, tmux]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set login shell to zsh
  ansible.builtin.user:
    name: "{{ ssh_user }}"
    shell: /usr/bin/zsh

- name: Install chezmoi
  ansible.builtin.shell: |
    set -o pipefail
    SCRIPT="$(curl -fsLS get.chezmoi.io)" || exit 1
    sh -c "${SCRIPT}" -- -b "${HOME}/.local/bin"
  args:
    executable: /bin/bash
    creates: "/home/{{ ssh_user }}/.local/bin/chezmoi"
  become: true
  become_user: "{{ ssh_user }}"

- name: Create chezmoi config directory
  ansible.builtin.file:
    path: "/home/{{ ssh_user }}/.config/chezmoi"
    state: directory
    owner: "{{ ssh_user }}"
    mode: "0755"

- name: Write chezmoi configuration
  ansible.builtin.copy:
    dest: "/home/{{ ssh_user }}/.config/chezmoi/chezmoi.toml"
    content: |
      [data]
          profile = "server"
    owner: "{{ ssh_user }}"
    mode: "0644"

- name: Check if chezmoi is initialized
  ansible.builtin.stat:
    path: "/home/{{ ssh_user }}/.local/share/chezmoi/.git"
  register: _chezmoi_source

- name: Initialize dotfiles (first run)
  ansible.builtin.command:
    cmd: /home/{{ ssh_user }}/.local/bin/chezmoi init --apply --force {{ dotfiles_github_user }}
  become: true
  become_user: "{{ ssh_user }}"
  when: not _chezmoi_source.stat.exists

- name: Update dotfiles (subsequent runs)
  ansible.builtin.command:
    cmd: /home/{{ ssh_user }}/.local/bin/chezmoi update --force
  become: true
  become_user: "{{ ssh_user }}"
  changed_when: false
  when: _chezmoi_source.stat.exists
