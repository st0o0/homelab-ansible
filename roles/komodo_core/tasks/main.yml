# -- Teardown (disabled) --
- name: Check if deploy directory exists (teardown)
  ansible.builtin.stat:
    path: "{{ komodo_core_deploy_path }}"
  register: _komodo_core_dir_teardown
  when: not komodo_core_enabled

- name: Stop komodo_core when disabled
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_core_deploy_path }}"
    state: absent
    remove_orphans: true
  check_mode: false
  when:
    - not komodo_core_enabled
    - _komodo_core_dir_teardown.stat.exists

- name: Remove komodo_core deploy directory when disabled
  ansible.builtin.file:
    path: "{{ komodo_core_deploy_path }}"
    state: absent
  when: not komodo_core_enabled

- name: Skip komodo_core if disabled
  ansible.builtin.meta: end_role
  when: not komodo_core_enabled

# -- Prerequisites --
- name: Install sops, age, and jq
  ansible.builtin.apt:
    name:
      - sops
      - age
      - jq
    state: present
    update_cache: true
    cache_valid_time: 3600

# -- Deploy --
- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ komodo_core_deploy_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create komodo root directory
  ansible.builtin.file:
    path: "{{ komodo_core_periphery_root }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create backups directory
  ansible.builtin.file:
    path: "{{ komodo_core_backups_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ komodo_core_deploy_path }}/compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart komodo_core

- name: Deploy Bifrost network override
  ansible.builtin.copy:
    src: compose.override.bifrost.yml
    dest: "{{ komodo_core_deploy_path }}/compose.override.bifrost.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  when: komodo_core_bifrost
  notify: Restart komodo_core

- name: Remove Bifrost network override when disabled
  ansible.builtin.file:
    path: "{{ komodo_core_deploy_path }}/compose.override.bifrost.yml"
    state: absent
  when: not komodo_core_bifrost
  notify: Restart komodo_core

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ komodo_core_deploy_path }}/.env"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  notify: Restart komodo_core

- name: Deploy core secrets config
  ansible.builtin.template:
    src: core.secrets.toml.j2
    dest: "{{ komodo_core_deploy_path }}/core.secrets.toml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  notify: Restart komodo_core

- name: Deploy AGE private key
  ansible.builtin.copy:
    content: "{{ komodo_core_age_key }}"
    dest: "{{ komodo_core_periphery_root }}/age.key"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  when: komodo_core_age_key | default('') | length > 0
  no_log: true

- name: Configure SOPS_AGE_KEY_FILE environment
  ansible.builtin.copy:
    content: "export SOPS_AGE_KEY_FILE={{ komodo_core_periphery_root }}/age.key\n"
    dest: /etc/profile.d/komodo-sops.sh
    owner: root
    group: root
    mode: "0644"
  when: komodo_core_age_key | default('') | length > 0

# -- Ensure running --
- name: Wait for bifrost container
  community.docker.docker_container_info:
    name: bifrost
  register: _komodo_core_bifrost_container
  until: _komodo_core_bifrost_container.container.State.Running | default(false)
  retries: 12
  delay: 5
  when: komodo_core_bifrost

- name: Ensure komodo_core is running
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_core_deploy_path }}"
    state: present
    remove_orphans: true
  ignore_errors: "{{ ansible_check_mode }}"
