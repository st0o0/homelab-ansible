- name: Stop and disable fail2ban when disabled
  ansible.builtin.service:
    name: fail2ban
    enabled: false
    state: stopped
  failed_when: false
  when: not fail2ban_enabled

- name: Remove fail2ban package when disabled
  ansible.builtin.apt:
    name: fail2ban
    state: absent
    purge: true
  when: not fail2ban_enabled

- name: Skip if fail2ban disabled
  ansible.builtin.meta: end_role
  when: not fail2ban_enabled

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy fail2ban jail config
  ansible.builtin.template:
    src: jail-hardening.conf.j2
    dest: /etc/fail2ban/jail.d/99-ansible-hardening.conf
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
