# -- Teardown (disabled) --
- name: Check if deploy directory exists (teardown)
  ansible.builtin.stat:
    path: "{{ komodo_deploy_path }}"
  register: _komodo_dir_teardown
  when: not komodo_enabled

- name: Stop komodo when disabled
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_deploy_path }}"
    state: absent
    remove_orphans: true
  check_mode: false
  when:
    - not komodo_enabled
    - _komodo_dir_teardown.stat.exists

- name: Remove komodo deploy directory when disabled
  ansible.builtin.file:
    path: "{{ komodo_deploy_path }}"
    state: absent
  when: not komodo_enabled

- name: Skip komodo if disabled
  ansible.builtin.meta: end_role
  when: not komodo_enabled

# -- Prerequisites --
- name: Install jq
  ansible.builtin.apt:
    name: jq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set architecture fact for sops/age downloads
  ansible.builtin.set_fact:
    _komodo_arch: >-
      {{ 'arm64' if ansible_architecture == 'aarch64'
         else 'amd64' if ansible_architecture == 'x86_64'
         else ansible_architecture }}

- name: Check if sops is installed
  ansible.builtin.stat:
    path: /usr/local/bin/sops
  register: _komodo_sops_bin

- name: Install sops binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ komodo_sops_version }}/sops-v{{ komodo_sops_version }}.linux.{{ _komodo_arch }}"
    dest: /usr/local/bin/sops
    mode: "0755"
  when: not _komodo_sops_bin.stat.exists

- name: Check if age is installed
  ansible.builtin.stat:
    path: /usr/local/bin/age
  register: _komodo_age_bin

- name: Download and install age
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "https://dl.filippo.io/age/latest?for=linux/{{ _komodo_arch }}" -o /tmp/komodo-age.tar.gz
    tar -xzf /tmp/komodo-age.tar.gz -C /usr/local/bin/ --strip-components=1 age/age age/age-keygen
    rm -f /tmp/komodo-age.tar.gz
  args:
    executable: /bin/bash
  when: not _komodo_age_bin.stat.exists

# -- Deploy --
- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ komodo_deploy_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create komodo root directory
  ansible.builtin.file:
    path: "{{ komodo_periphery_root }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create backups directory
  ansible.builtin.file:
    path: "{{ komodo_backups_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ komodo_deploy_path }}/compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart komodo

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ komodo_deploy_path }}/.env"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  notify: Restart komodo

- name: Deploy core secrets config
  ansible.builtin.template:
    src: core.secrets.toml.j2
    dest: "{{ komodo_deploy_path }}/core.secrets.toml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  notify: Restart komodo

- name: Deploy AGE private key
  ansible.builtin.copy:
    content: "{{ komodo_age_key }}"
    dest: "{{ komodo_periphery_root }}/age.key"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  when: komodo_age_key | default('') | length > 0
  no_log: true

- name: Configure SOPS_AGE_KEY_FILE environment
  ansible.builtin.copy:
    content: "export SOPS_AGE_KEY_FILE={{ komodo_periphery_root }}/age.key\n"
    dest: /etc/profile.d/komodo-sops.sh
    owner: root
    group: root
    mode: "0644"
  when: komodo_age_key | default('') | length > 0

# -- Ensure running --
- name: Ensure komodo is running
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_deploy_path }}"
    state: present
    remove_orphans: true
  ignore_errors: "{{ ansible_check_mode }}"
