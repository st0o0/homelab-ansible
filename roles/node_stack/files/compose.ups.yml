services:
  nut-upsd:
    image: instantlinux/nut-upsd
    container_name: nut-upsd
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - DRIVER=${NUT_DRIVER}
      - NAME=${NUT_NAME}
      - PORT=${NUT_PORT}
      - POLLINTERVAL=${NUT_POLLINTERVAL}
      - API_USER=${NUT_API_USER}
      - API_PASSWORD=${NUT_API_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "3493:3493"
    volumes:
      - ./nut:/etc/nut

  peanut:
    image: brandawg93/peanut:latest
    container_name: peanut
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./peanut:/config
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - PUID=1000
      - PGID=1000
      - WEB_PORT=8080
