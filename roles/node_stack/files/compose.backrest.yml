services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - TZ=${TZ}
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    ports:
      - "127.0.0.1:${BACKREST_PORT}:9898"
    volumes:
      - ./backrest/config:/config
      - backrest-data:/data
      - /docker:/docker:ro

volumes:
  backrest-data:
