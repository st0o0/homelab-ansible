- name: Stop apt-daily timer when disabled
  ansible.builtin.systemd:
    name: apt-daily.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not unattended_upgrades_enabled

- name: Stop apt-daily-upgrade timer when disabled
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not unattended_upgrades_enabled

- name: Remove unattended-upgrades config when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/50unattended-upgrades
    - /etc/apt/apt.conf.d/20auto-upgrades
  when: not unattended_upgrades_enabled

- name: Remove unattended-upgrades package when disabled
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    purge: true
  when: not unattended_upgrades_enabled

- name: Skip if unattended upgrades disabled
  ansible.builtin.meta: end_role
  when: not unattended_upgrades_enabled

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  notify: Restart unattended-upgrades

- name: Enable automatic update checks
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"
  notify: Restart unattended-upgrades

- name: Enable apt-daily timer
  ansible.builtin.systemd:
    name: apt-daily.timer
    enabled: true
    state: started

- name: Enable apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: true
    state: started
