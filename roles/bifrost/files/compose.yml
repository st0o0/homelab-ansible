x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bifrost:
    image: ghcr.io/st0o0/bifrost:0.2.0
    container_name: bifrost
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - BIFROST_PRIVATE_KEY=${BIFROST_PRIVATE_KEY}
      - BIFROST_ADDRESS=${BIFROST_ADDRESS}
      - BIFROST_LISTEN_PORT=${BIFROST_LISTEN_PORT}
      - BIFROST_MTU=${BIFROST_MTU}
      - BIFROST_PEER_PUBLIC_KEY=${BIFROST_PEER_PUBLIC_KEY}
      - BIFROST_PEER_ENDPOINT=${BIFROST_PEER_ENDPOINT}
      - BIFROST_PEER_ALLOWED_IPS=${BIFROST_PEER_ALLOWED_IPS}
      - BIFROST_PEER_KEEPALIVE=${BIFROST_PEER_KEEPALIVE}
      - BIFROST_PEER_PRESHARED_KEY=${BIFROST_PEER_PRESHARED_KEY}
      - BIFROST_INTERFACE=wg0
      - BIFROST_CHECK_INTERVAL=30
      - BIFROST_STALE_AFTER=135
      - BIFROST_RESOLVE=on
      - BIFROST_RECONNECT=on
      - BIFROST_HEALTHCHECK=on
      - BIFROST_PROBE=off
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

  eir:
    image: ghcr.io/st0o0/eir:latest
    container_name: eir
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      bifrost:
        condition: service_started
    environment:
      - EIR_MASTERS=bifrost
      - EIR_DISCOVERY_MODE=inspect
      - EIR_STABILIZE_WAIT=15s
      - EIR_MAX_RETRIES=3
      - EIR_RETRY_BACKOFF=5s
      - EIR_LOG_LEVEL=info
      - EIR_LOG_FORMAT=text
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 32M
