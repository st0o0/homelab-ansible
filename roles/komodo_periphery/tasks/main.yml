# -- Teardown (disabled) --
- name: Check if deploy directory exists (teardown)
  ansible.builtin.stat:
    path: "{{ komodo_periphery_deploy_path }}"
  register: _komodo_periphery_dir_teardown
  when: not komodo_periphery_enabled

- name: Stop komodo_periphery when disabled
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_periphery_deploy_path }}"
    state: absent
    remove_orphans: true
  check_mode: false
  when:
    - not komodo_periphery_enabled
    - _komodo_periphery_dir_teardown.stat.exists

- name: Remove komodo_periphery deploy directory when disabled
  ansible.builtin.file:
    path: "{{ komodo_periphery_deploy_path }}"
    state: absent
  when: not komodo_periphery_enabled

- name: Skip komodo_periphery if disabled
  ansible.builtin.meta: end_role
  when: not komodo_periphery_enabled

# -- Deploy --
- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ komodo_periphery_deploy_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create komodo root directory
  ansible.builtin.file:
    path: "{{ komodo_periphery_root_directory }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ komodo_periphery_deploy_path }}/compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart komodo_periphery

- name: Deploy Bifrost network override
  ansible.builtin.copy:
    src: compose.override.bifrost.yml
    dest: "{{ komodo_periphery_deploy_path }}/compose.override.bifrost.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  when: komodo_periphery_bifrost
  notify: Restart komodo_periphery

- name: Remove Bifrost network override when disabled
  ansible.builtin.file:
    path: "{{ komodo_periphery_deploy_path }}/compose.override.bifrost.yml"
    state: absent
  when: not komodo_periphery_bifrost
  notify: Restart komodo_periphery

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ komodo_periphery_deploy_path }}/.env"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  notify: Restart komodo_periphery

# -- Ensure running --
- name: Wait for bifrost container
  community.docker.docker_container_info:
    name: bifrost
  register: _komodo_periphery_bifrost_container
  until: _komodo_periphery_bifrost_container.container.State.Running | default(false)
  retries: 12
  delay: 5
  when: komodo_periphery_bifrost

- name: Ensure komodo_periphery is running
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_periphery_deploy_path }}"
    state: present
    remove_orphans: true
  ignore_errors: "{{ ansible_check_mode }}"
