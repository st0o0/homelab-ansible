- name: Converge all hosts
  hosts: all
  become: true
  roles:
    - role: bootstrap
      tags: [bootstrap]
    - role: ssh
      tags: [ssh, bootstrap]
    - role: swap
      tags: [swap]
    - role: unattended_upgrades
      tags: [unattended_upgrades]
    - role: ufw
      tags: [ufw]
    - role: docker
      tags: [docker]
    - role: ups
      tags: [ups]
    - role: cron
      tags: [cron]
    - role: shell
      tags: [shell, motd, dotfiles]
    - role: node_stack
      tags: [node_stack]
