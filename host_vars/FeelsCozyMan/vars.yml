# Bootstrap
# bootstrap_hostname_enabled: true

# Shell
# shell_motd_enabled: true
# shell_dotfiles_enabled: true

# Unattended upgrades
unattended_upgrades_enabled: true
unattended_upgrades_skip_reboot_required: true
unattended_upgrades_blacklist:
  - "docker-ce"
  - "docker-ce-cli"
  - "containerd.io"
  - "wireguard*"
  - "iptables*"
  - "nftables*"
  - "netfilter*"
  - "iproute2"
  - "bridge-utils"
# unattended_upgrades_auto_reboot: false
# unattended_upgrades_auto_reboot_time: "04:00"

# Swap
# swap_enabled: false
# swap_size: "2G"

# Firewall
# ufw_enabled: false
# ufw_extra_rules:
#   - { rule: allow, port: 8080, proto: tcp, comment: "Web" }

# Fail2Ban
# fail2ban_enabled: true
# fail2ban_extra_jails:
#   - { name: nginx-http-auth, enabled: true, port: "http,https", filter: nginx-http-auth, logpath: /var/log/nginx/error.log }

# Auditd
# auditd_enabled: true
# auditd_extra_rules:
#   - "-w /etc/hosts -p wa -k network"

# Sysctl hardening
# sysctl_hardening_enabled: true

# PAM password quality
# pam_pwquality_enabled: true

# Docker
docker_enabled: true

# Cron
cron_enabled: true
cron_docker_prune: true
# cron_extra_jobs: []

# rkhunter
# rkhunter_enabled: true
# rkhunter_schedule: "0 4 * * *"

# ClamAV
# clamav_enabled: true
# clamav_schedule: "0 3 * * *"

# Lynis
# lynis_enabled: true
# lynis_schedule: "0 5 * * 0"

# UPS
# ups_client_enabled: false

# Hawser (Dockhand agent)
hawser_enabled: false
hawser_bifrost: false

# Komodo (Core host — Core + bundled local Periphery; Mongo runs on FeelsDataMan)
komodo_enabled: true
agent_enabled: false
